{% extends "basis.html" %}
{% block inhalt %}
<form method="get" class="parameter">
    <label>Historische Monate
        <select name="gewinn_verlust_monate" onchange="this.form.submit()">
            {% for wert in gewinn_verlust_optionen %}
            <option value="{{ wert }}" {{ "selected" if wert == gewinn_verlust_monate }}>{{ "alle" if wert == "alle" else wert ~ " Monate" }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Prognosehorizont
        <select name="horizont_monate" onchange="this.form.submit()">
            {% for wert in horizont_optionen %}
            <option value="{{ wert }}" {{ "selected" if wert == horizont_monate }}>{{ wert }} Monate</option>
            {% endfor %}
        </select>
    </label>
    <details class="regler-abschnitt" {{ "open" if verbrauchsplan_abweichend }}>
        <summary>Verbrauchsplan-Übersteuerung <span class="zusammenfassung">(optional)</span></summary>
        <div class="regler-gruppe">
            <label>Eine Zeile je Projekt, Format "Projektname: JJJJ-MM":
                <textarea name="verbrauchsplan" rows="3" placeholder="Beispielprojekt: 2026-12">{{ verbrauchsplan }}</textarea>
            </label>
            <div class="regler-aktionen">
                <button type="submit">Anwenden</button>
                <a class="zuruecksetzen" href="/?horizont_monate={{ horizont_monate }}&gewinn_verlust_monate={{ gewinn_verlust_monate }}">Verbrauchsplan zurücksetzen</a>
            </div>
        </div>
    </details>
</form>
{{ gewinn_verlust_monatlich | safe }}
{{ gewinn_verlust_je_jahr | safe }}
{{ umsatzrendite_kumuliert | safe }}
{% endblock %}
