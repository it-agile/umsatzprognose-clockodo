<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <title>Umsatzprognose</title>
    {% block kopf %}{% endblock %}
    <style>
        body { font-family: sans-serif; margin: 2rem; color: #222; }
        h1 { font-size: 1.1rem; color: #555; font-weight: normal; }
        nav { margin-bottom: 1.5rem; border-bottom: 1px solid #ddd; padding-bottom: 0.5rem; }
        nav a { margin-right: 1.5rem; text-decoration: none; color: #333; font-weight: 600; }
        nav a.aktiv { color: #0a5; border-bottom: 2px solid #0a5; }
        table { border-collapse: collapse; margin: 1rem 0 2rem; }
        th, td { padding: 0.3rem 0.8rem; text-align: right; border-bottom: 1px solid #eee; }
        th:first-child, td:first-child { text-align: left; }
        th { color: #555; font-weight: 600; }
        .parameter { margin-bottom: 1rem; }
        .parameter label { margin-right: 1.5rem; color: #555; }
        .ladehinweis { color: #555; }
    </style>
</head>
<body>
    <nav>
        <a href="/{{ anfrage_query }}" class="{{ 'aktiv' if aktive_seite == 'start' }}">Datencheck</a>
        <a href="/dashboard{{ anfrage_query }}" class="{{ 'aktiv' if aktive_seite == 'dashboard' }}">Dashboard</a>
        <a href="/schulungen{{ anfrage_query }}" class="{{ 'aktiv' if aktive_seite == 'schulungen' }}">Schulungen</a>
    </nav>
    <h1>{% if stichtag %}Stand der Auswertung: {{ stichtag.strftime("%d.%m.%Y") }}{% else %}Daten werden geladen …{% endif %}</h1>
    {% block inhalt %}{% endblock %}
</body>
</html>
