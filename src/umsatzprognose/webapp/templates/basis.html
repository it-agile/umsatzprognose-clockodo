<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <title>Umsatzprognose</title>
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    {% block kopf %}{% endblock %}
    <style>
        body { font-family: sans-serif; margin: 2rem; color: #222; }
        h1 { font-size: 1.1rem; color: #555; font-weight: normal; }
        nav { margin-bottom: 1.5rem; border-bottom: 1px solid #ddd; padding-bottom: 0.5rem; }
        nav a { margin-right: 1.5rem; text-decoration: none; color: #333; font-weight: 600; }
        nav a.aktiv { color: #0a5; border-bottom: 2px solid #0a5; }
        table { border-collapse: collapse; margin: 1rem 0 2rem; }
        th, td { padding: 0.3rem 0.8rem; text-align: right; border-bottom: 1px solid #eee; }
        th:first-child, td:first-child { text-align: left; }
        th { color: #555; font-weight: 600; }
        .parameter { margin-bottom: 1rem; }
        .parameter label { margin-right: 1.5rem; color: #555; }
        .parameter output { display: inline-block; min-width: 3.5em; }
        .regler-abschnitt { margin-top: 0.8rem; }
        .regler-abschnitt summary { cursor: pointer; color: #555; }
        .regler-abschnitt[open] summary .zusammenfassung { display: none; }
        .regler-gruppe { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.6rem; }
        .regler-gruppe label { color: #555; }
        .zuruecksetzen {
            display: inline-block; margin-top: 0.4rem; color: #555; text-decoration: none;
            border: 1px solid #ccc; border-radius: 3px; padding: 0.2rem 0.6rem; width: fit-content;
        }
        .zuruecksetzen:hover { background: #f2f2f2; }
        /* Dieselbe Farbfamilie wie ERGEBNIS_POSITIV/ERGEBNIS_NEGATIV in
           darstellung/gestaltung.py, fuer dieselbe Unterscheidung im Text wie in
           der Kurzarbeitsgrafik. */
        .status-positiv { color: #3f7d54; font-weight: 600; }
        .status-negativ { color: #8c2f2f; font-weight: 600; }
        .ladehinweis { color: #555; }
        .fortschritt { list-style: none; padding: 0; color: #555; }
        .fortschritt li { padding: 0.2rem 0; }
        .fehler { color: #a00; border-left: 3px solid #a00; padding-left: 0.6rem; }
    </style>
</head>
<body>
    <nav>
        <a href="/{{ anfrage_query }}" class="{{ 'aktiv' if aktive_seite == 'start' }}">Datencheck</a>
        <a href="/dashboard{{ anfrage_query }}" class="{{ 'aktiv' if aktive_seite == 'dashboard' }}">Dashboard</a>
        <a href="/schulungen{{ anfrage_query }}" class="{{ 'aktiv' if aktive_seite == 'schulungen' }}">Schulungen</a>
        <a href="/kurzarbeit{{ anfrage_query }}" class="{{ 'aktiv' if aktive_seite == 'kurzarbeit' }}">Kurzarbeit</a>
    </nav>
    <h1>{% if stichtag %}Stand der Auswertung: {{ stichtag.strftime("%d.%m.%Y") }}{% else %}Daten werden geladen …{% endif %}</h1>
    {% block inhalt %}{% endblock %}
</body>
</html>
