[project]
name = "umsatzprognose-clockodo"
version = "0.1.0"
description = "Rollierende 1-3-Monats-Umsatzprognose fuer den Baustein Bestand aus Clockodo-Daten"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.0,<2.3; python_version<='3.13'",
    "numpy>=2.3; python_version>'3.13'",
    "pandas-stubs~=3.0.5",
    "pandas>=2.2",
    "plotly>=5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbformat>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umsatzprognose"]

[dependency-groups]
dev = [
    "kaleido>=0.2",
    "pytest>=8.3",
    "ruff>=0.8",
]
ruff = [
    "ruff>=0.8",
]
coverage = [
    "pytest>=8.3",
    "coverage>=7.0",
]

[tool.tox]
env_list = [ "py312", "py313", "py314", "coverage", "ruff" ]
use_develop = true

[tool.tox.env_run_base]
extras = [ "dev" ]
allowlist_externals = [ "pytest" ]
commands = [["pytest", { replace = "posargs", default = [], extend = true }]]

[tool.tox.env.coverage]
extras = [ "coverage" ]
allowlist_externals = [ "coverage" ]
commands = [
    ["coverage", "erase"],
    ["coverage", "run", "-m", "pytest", { replace = "posargs", default = ["tests"], extend = true }],
    ["coverage", "report"],
    ["coverage", "xml"],
    ["coverage", "html"],
]

[tool.tox.env.ruff]
extras = [ "ruff" ]
allowlist_externals = [ "ruff" ]
commands = [[ "ruff", "check", { replace = "posargs", default = ["src", "tests"], extend = true }]]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["C40", "E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = []
fixable = ["A", "B", "C", "D", "E", "F", "I"]
unfixable = []
per-file-ignores = {}
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
mccabe.max-complexity = 10

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
