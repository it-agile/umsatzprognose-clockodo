[project]
name = "umsatzprognose-clockodo"
version = "0.1.0"
description = "Rollierende 1-3-Monats-Umsatzprognose fuer den Baustein Bestand aus Clockodo-Daten"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pandas-stubs~=3.0.5",
    # Kein numpy: es wird noch nirgends benutzt und der Pin wuerde in Colab eine
    # Aktualisierung erzwingen (numba dort verlangt numpy < 2.3). Kommt mit der
    # Monte-Carlo-Simulation (Spec 5.4) wieder herein.
    "pandas>=2.2",
    # Untergrenze niedrig und ohne Obergrenze mit Absicht: Colab bringt plotly mit,
    # "plotly>=5" ist damit erfuellt und pip laesst die vorhandene Version stehen.
    # Ein enger Pin wuerde dort eine Neuinstallation erzwingen - genau das, was bei
    # numpy schon einmal google-colab und numba gebrochen hat.
    "plotly>=5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    # Ohne nbformat rendert fig.show() in lokalem JupyterLab nicht. In Colab ist es da.
    "nbformat>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umsatzprognose"]

[dependency-groups]
dev = [
    # Nur lokal: rendert Diagramme als PNG, damit man sie vor dem Ausliefern ansieht.
    # Bewusst keine Laufzeitabhaengigkeit - in Colab zeichnet der Browser.
    "kaleido>=0.2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["C40", "E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = []
fixable = ["A", "B", "C", "D", "E", "F", "I"]
unfixable = []
per-file-ignores = {}
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
mccabe.max-complexity = 10

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
