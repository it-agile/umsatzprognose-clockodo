[project]
name = "umsatzprognose-clockodo"
version = "0.1.0"
description = "Rollierende 1-3-Monats-Umsatzprognose fuer den Baustein Bestand aus Clockodo-Daten"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.0,<2.3",
    "pandas-stubs~=3.0.5",
    "pandas>=2.2",
    "plotly>=5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbformat>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umsatzprognose"]

[dependency-groups]
dev = [
    "kaleido>=0.2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["C40", "E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = []
fixable = ["A", "B", "C", "D", "E", "F", "I"]
unfixable = []
per-file-ignores = {}
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
mccabe.max-complexity = 10

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
