[project]
name = "umsatzprognose-clockodo"
version = "0.1.0"
description = "Rollierende Umsatzprognose aus Clockodo-Projekten mit Schulungsanmeldungen und Kostenprognose aus Google Sheets, als Jupyter/Colab-Dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.30",
    "httpx>=0.28",
    "humanize>=4.11",
    "numpy>=2.0,<2.3; python_version<='3.13'",
    "numpy>=2.3; python_version>'3.13'",
    "pandas>=2.2",
    "plotly>=5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbformat>=4.2",
]
dev = [
    "kaleido>=0.2",
    "pytest>=8.3",
    "ruff>=0.8",
]
bericht = [
    "kaleido>=0.2",
    "slack-sdk>=3.27",
]
ruff = [
    "ruff>=0.8",
]
coverage = [
    "pytest>=8.3",
    "coverage>=7.0",
]
mypy = [
    "mypy>=1.13",
    "nbqa>=1.9",
    "pandas-stubs~=3.0.5",
]

[build-system]
requires = [ "hatchling>=1.32", "tox>=4.60", "tox-uv>=1.36" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umsatzprognose"]

[tool.tox]
env_list = [ "py312", "py313", "py314", "coverage", "ruff", "mypy", "mypy-notebooks" ]
use_develop = true

[tool.tox.env_run_base]
extras = [ "dev" ]
allowlist_externals = [ "pytest" ]
commands = [["pytest", { replace = "posargs", default = [], extend = true }]]

[tool.tox.env.coverage]
extras = [ "coverage" ]
allowlist_externals = [ "coverage" ]
commands = [
    ["coverage", "erase"],
    ["coverage", "run", "-m", "pytest", { replace = "posargs", default = ["tests"], extend = true }],
    ["coverage", "report"],
    ["coverage", "xml"],
    ["coverage", "html"],
]

[tool.tox.env.ruff]
extras = [ "ruff" ]
allowlist_externals = [ "ruff" ]
commands = [[ "ruff", "check", { replace = "posargs", default = ["src", "tests", "notebooks"], extend = true }]]

[tool.tox.env.mypy]
extras = [ "mypy" ]
allowlist_externals = [ "mypy" ]
commands = [[ "mypy", { replace = "posargs", default = ["src", "tests"], extend = true }]]

[tool.tox.env.mypy-notebooks]
extras = [ "mypy", "notebook" ]
allowlist_externals = [ "nbqa" ]
commands = [[ "nbqa", "mypy", { replace = "posargs", default = ["notebooks"], extend = true }]]

[tool.tox.env.jupyter]
extras = [ "notebook" ]
allowlist_externals = [ "jupyter" ]
commands = [[ "jupyter", { replace = "posargs", default = ["lab", "--autoreload"], extend = true } ]]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["C40", "E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = []
fixable = ["A", "B", "C", "D", "E", "F", "I"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
mccabe.max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.mypy]
packages = ["src","tests"]
ignore_missing_imports = true
follow_imports = "silent"
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_reexport = true
strict_equality = true
show_error_codes = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.paths]
source = [
    "src/umsatzprognose",
    "*/umsatzprognose"
]

[tool.coverage.run]
source_pkgs = [
    "umsatzprognose",
]

[tool.coverage.report]
omit = [
    ".githooks/*",
    "tests/*",
    "*/__init__.py",
]
