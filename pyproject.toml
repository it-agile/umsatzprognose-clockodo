[project]
name = "umsatzprognose-clockodo"
version = "0.1.0"
description = "Rollierende 1-3-Monats-Umsatzprognose fuer den Baustein Bestand aus Clockodo-Daten"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    # Kein numpy: es wird noch nirgends benutzt und der Pin wuerde in Colab eine
    # Aktualisierung erzwingen (numba dort verlangt numpy < 2.3). Kommt mit der
    # Monte-Carlo-Simulation (Spec 5.4) wieder herein.
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umsatzprognose"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
