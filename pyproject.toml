[project]
name = "umsatzprognose-clockodo"
version = "0.1.0"
description = "Rollierende Umsatzprognose aus Clockodo-Projekten mit Schulungsanmeldungen und Kostenprognose aus Google Sheets, als Jupyter/Colab-Dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.30",
    "httpx2>=2.0",
    "humanize>=4.11",
    "numpy>=2.0,<2.3; python_version<='3.13'",
    "numpy>=2.3; python_version>'3.13'",
    "pandas>=2.2",
    "plotly>=5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
kaleido = [
    "kaleido>=0.2",
]
pytest = [
    "pytest>=8.3",
]
ruff = [
    "ruff>=0.8",
]

notebook = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.2",
    "nbformat>=4.2",
    "tqdm>=4.66",
]
dev = [
    "umsatzprognose-clockodo[kaleido]",
    "umsatzprognose-clockodo[pytest]",
    "umsatzprognose-clockodo[ruff]",
]
bericht = [
    "umsatzprognose-clockodo[kaleido]",
    "slack-sdk>=3.27",
    "tqdm>=4.66",
]
web = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.32",
]
coverage = [
    "umsatzprognose-clockodo[pytest]",
    "coverage>=7.0",
]
mypy = [
    "mypy>=1.13",
    "nbqa>=1.9",
    "pandas-stubs~=3.0.5",
]
ty = [
    "ty>=0.0.80",
]

[build-system]
requires = [ "hatchling>=1.32", "tox>=4.60", "tox-uv>=1.36" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umsatzprognose"]

[tool.tox]
env_list = [ "py312", "py313", "py314", "coverage", "ruff", "mypy", "mypy-notebooks" ]
use_develop = true

[tool.tox.env_run_base]
extras = [ "dev", "bericht" ]
allowlist_externals = [ "pytest" ]
commands = [["pytest", { replace = "posargs", default = [], extend = true }]]

[tool.tox.env.coverage]
extras = [ "coverage", "ruff", "web", "bericht" ]
allowlist_externals = [ "coverage" ]
commands = [
    ["coverage", "erase"],
    ["coverage", "run", "-m", "pytest", { replace = "posargs", default = ["tests"], extend = true }],
    ["coverage", "report"],
    ["coverage", "xml"],
    ["coverage", "html"],
]

[tool.tox.env.ruff]
extras = [ "ruff" ]
allowlist_externals = [ "ruff" ]
commands = [[ "ruff", "check", { replace = "posargs", default = ["src", "tests", "notebooks"], extend = true }]]

[tool.tox.env.mypy]
extras = [ "mypy", "web", "bericht" ]
allowlist_externals = [ "mypy" ]
commands = [[ "mypy", { replace = "posargs", default = ["src", "tests", "scripts"], extend = true }]]

[tool.tox.env.mypy-notebooks]
extras = [ "mypy", "notebook" ]
allowlist_externals = [ "nbqa" ]
commands = [[ "nbqa", "mypy", { replace = "posargs", default = ["notebooks"], extend = true }]]

[tool.tox.env.ty]
extras = [ "ty", "dev", "bericht", "web", "notebook" ]
allowlist_externals = [ "ty" ]
ignore_outcome = true
commands = [[ "ty", "check", { replace = "posargs", default = ["src", "tests", "scripts", "notebooks"], extend = true } ]]

[tool.tox.env.jupyter]
extras = [ "notebook" ]
allowlist_externals = [ "jupyter" ]
commands = [[ "jupyter", { replace = "posargs", default = ["lab", "--autoreload"], extend = true } ]]

[tool.tox.env.web]
extras = [ "web" ]
allowlist_externals = [ "uvicorn" ]
commands = [[ "uvicorn", { replace = "posargs", default = ["umsatzprognose.webapp.app:app"], extend = true } ]]

[tool.ruff]
line-length = 100
src = ["src", "tests", "notebooks"]

[tool.ruff.lint]
select = [
    "C40", "C90", "E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF",
    "PERF", "RET", "PIE", "FBT", "SLF", "PLW0108",
]  # fmt: skip
ignore = []
fixable = ["B", "C", "E", "F", "I"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
mccabe.max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
"tests/*" = ["SLF001"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
mypy_path = ["src", "scripts"]
packages = ["umsatzprognose", "tests"]
ignore_missing_imports = true
follow_imports = "silent"
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_reexport = true
strict_equality = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "umsatzprognose.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ty.environment]
extra-paths = ["scripts", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.paths]
source = [
    "src/umsatzprognose",
    "*/umsatzprognose"
]

[tool.coverage.run]
source_pkgs = [
    "umsatzprognose",
]

[tool.coverage.report]
fail_under = 90
omit = [
    ".githooks/*",
    "tests/*",
    "*/__init__.py",
]
