name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

# Ein neuer Push auf denselben Branch/PR bricht einen noch laufenden Lauf ab, statt
# beide bis zum Ende laufen zu lassen.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# "uvx tox" allein läuft mit tox' eingebautem virtualenv-Runner, der nur bereits auf
# dem Runner vorhandene Interpreter findet - ubuntu-latest bringt aber nur eine
# Python-Version mit. "--with tox-uv" lädt den in pyproject.toml als Build-Abhängigkeit
# geführten Plugin mit in dieselbe uvx-Umgebung und schaltet dadurch tox auf uvs
# eigene Python-Verwaltung um (uv-venv-runner), die fehlende Versionen (hier py313,
# py314) bei Bedarf selbst herunterlädt - kein separates actions/setup-python nötig.
jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx --with tox-uv tox -e ruff

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx --with tox-uv tox -e mypy

  mypy-notebooks:
    name: mypy (Notebooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx --with tox-uv tox -e mypy-notebooks

  # Rein beobachtend: ty (github.com/astral-sh/ty) ist noch in frueher Entwicklung
  # (Version 0.0.x, siehe [tool.tox.env.ty] in pyproject.toml) und ersetzt mypy hier
  # nicht, sondern laeuft nur mit, damit sich die Reife des Werkzeugs ueber die Zeit im
  # Log beobachten laesst. ignore_outcome in [tool.tox.env.ty] laesst tox trotz eines
  # Fehlschlags mit Exit-Code 0 enden; continue-on-error hier ist die zusaetzliche
  # Absicherung auf Workflow-Ebene, falls sich das je aendern sollte - beide zusammen,
  # damit ein Fehlschlag weder den Build noch den Job-Status rot markiert.
  ty:
    name: ty (Beobachtung, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx --with tox-uv tox -e ty

  # Je Python-Version ein eigener Job statt eines gemeinsamen Matrix-Laufs mit
  # gemeinsamem Ergebnis - ein Fehlschlag unter py314 blockiert nicht die Sichtbarkeit
  # der Ergebnisse unter py312/py313, siehe fail-fast: false.
  test:
    name: pytest (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [py312, py313, py314]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx --with tox-uv tox -e ${{ matrix.env }}

  # Coverage ist nur aussagekräftig, wenn die Tests unter allen drei Python-Versionen
  # schon ohne Coverage-Instrumentierung grün sind - deshalb erst nach "test".
  coverage:
    name: coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx --with tox-uv tox -e coverage
